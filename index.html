<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171b18">
<title>江湖行旅｜文字武俠回合制</title>
<style>
:root{color-scheme:dark;--ink:#e9e2d2;--muted:#aaa18e;--gold:#d6b978;--jade:#7eaa8c;--red:#bd6b58;--panel:#202621;--line:#41483e;--deep:#151a17}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#465245 0,#252d27 38%,#171b18 78%);color:var(--ink);font:16px/1.65 Georgia,"Noto Serif TC","Microsoft JhengHei",serif;min-height:100vh}button,input{font:inherit}button{color:var(--ink);background:#303a32;border:1px solid #596250;padding:10px 16px;cursor:pointer;transition:.18s}button:hover:not(:disabled){border-color:var(--gold);color:#ffe4a4;transform:translateY(-1px)}button:disabled{opacity:.4;cursor:not-allowed}.wrap{max-width:1140px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:5px 0 16px;margin-bottom:22px}.brand{letter-spacing:.22em;color:var(--gold);font-size:14px}.save{font-size:13px;color:var(--muted)}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(30px,5vw,48px);line-height:1.25;letter-spacing:.12em;margin-bottom:12px}h2{font-size:23px;color:var(--gold);font-weight:500}.lead{color:#c5bda9;max-width:690px}.panel{background:linear-gradient(145deg,#272f29ed,#1c221eef);border:1px solid var(--line);padding:22px;box-shadow:0 18px 55px #0003}.hero{padding:clamp(26px,6vw,68px);background:linear-gradient(90deg,#171b18eb,#171b18bf),radial-gradient(ellipse at right,#727658,#202820 55%);border:1px solid #60624e;position:relative;overflow:hidden}.hero:after{content:"俠";position:absolute;right:6%;top:-30px;font-size:260px;color:#d9bd7230;pointer-events:none}.hero>*{position:relative;z-index:1}.eyebrow{color:var(--jade);letter-spacing:.18em;font-size:13px}.name-row{display:flex;gap:10px;margin:20px 0 10px;max-width:480px}.name-row input{flex:1;min-width:0;background:#121714;border:1px solid #555e50;padding:10px 12px;color:var(--ink)}.sect-grid,.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.sect-card{text-align:left;min-height:165px;padding:17px;background:#222923d9}.sect-card b{display:block;color:var(--gold);font-size:19px;margin-bottom:5px}.sect-card span{display:block;color:var(--muted);font-size:14px}.sect-card em{font-style:normal;color:var(--jade);font-size:13px;display:block;margin-top:10px}.layout{display:grid;grid-template-columns:280px 1fr;gap:18px;align-items:start}.sidebar{display:grid;gap:14px}.stats{display:grid;grid-template-columns:1fr auto;gap:5px;font-size:14px}.stats span:nth-child(odd){color:var(--muted)}.bar{height:8px;background:#101411;margin:4px 0 10px;border:1px solid #373e36}.bar i{display:block;height:100%;background:var(--jade)}.bar.hp i{background:var(--red)}.bar.qi i{background:#7294ad}.main{min-height:510px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 20px}.actions button{flex:1;min-width:120px}.choice{display:block;width:100%;text-align:left;margin:9px 0;padding:13px 15px}.choice b{color:var(--gold);display:block;font-size:17px}.choice small{color:var(--muted)}.log{max-height:190px;overflow:auto;padding-left:20px;color:#c6beac;font-size:14px}.log li{margin:5px 0}.tag{display:inline-block;border:1px solid #505846;color:var(--jade);font-size:12px;padding:1px 8px;margin-right:5px}.enemy{border:1px solid #78564d;background:#321f1d88;padding:16px;margin:10px 0}.enemy h3{color:#e49c82;margin:0}.combat-moves{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px}.move{min-height:82px;text-align:left}.move strong{display:block;color:var(--gold)}.move small{color:var(--muted)}.muted{color:var(--muted)}.notice{color:#e1c988;border-left:2px solid var(--gold);padding-left:12px}.footer{text-align:center;color:#817c6f;font-size:12px;padding:22px}.hidden{display:none!important}.scene-card{border:1px solid #58604e;background:#171d19;margin:12px 0 20px;overflow:hidden}.scene-art{height:230px;background:#25302b;border-bottom:1px solid #58604e}.scene-art svg{width:100%;height:100%;display:block}.scene-copy{padding:16px 18px}.scene-copy h3{color:var(--gold);font-size:20px;margin:0 0 5px}.dialogue{font-size:17px;color:#e5ddcb;max-width:720px}.scene-options{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.scene-options button{flex:1;min-width:145px}.person-label{font-size:12px;color:var(--jade);letter-spacing:.1em}.place-pill{display:inline-block;color:#d7c58d;border:1px solid #676148;padding:2px 9px;font-size:12px;margin:0 6px 6px 0}@media(max-width:760px){.scene-art{height:185px}.scene-copy{padding:13px}.dialogue{font-size:15px}}@media(max-width:760px){.wrap{padding:14px}.layout{grid-template-columns:1fr}.sidebar{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.hero:after{font-size:180px;right:-10px}.panel{padding:17px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="brand">江湖行旅 <span class="muted">／ 一段由你寫下的武林傳奇</span></div><div class="save" id="save-status">尚未存檔</div></header>
<div id="app"></div>
<footer class="footer">原創武俠世界 · 你的選擇，決定你的江湖</footer>
</div>
<script>
(function(){
"use strict";
const sects=[
{id:"qingfeng",name:"青城劍派",style:"劍法輕靈，擅長連擊與閃避。",bonus:"身法 +2",stats:{dex:2},moves:["流雲劍","回風式","青嵐破"]},
{id:"canglang",name:"滄浪刀門",style:"刀勢沉雄，攻守兼備，招招有力。",bonus:"臂力 +2",stats:{str:2},moves:["斷潮刀","守勢","怒濤斬"]},
{id:"lingxiao",name:"凌霄宮",style:"內功綿長，真氣運轉自如。",bonus:"內力 +2",stats:{qi:2},moves:["寒星指","凝神","霜華落"]},
{id:"baihua",name:"百花谷",style:"醫武並修，療傷解毒皆有心得。",bonus:"根骨 +2",stats:{vit:2},moves:["花影掌","調息","落英回春"]},
{id:"tieyi",name:"鐵衣堂",style:"外家硬功，能承重擊、近身制敵。",bonus:"根骨 +1、臂力 +1",stats:{vit:1,str:1},moves:["鐵山靠","沉肩","震岳拳"]},
{id:"wandering",name:"無門無派",style:"不受門規所拘，自創一條江湖路。",bonus:"悟性 +2",stats:{wis:2},moves:["野路子","觀勢","破綻一擊"]}
];
const moves={
"流雲劍":{cost:3,power:1.35,desc:"迅捷一劍，容易命中"},
"回風式":{cost:2,guard:1,desc:"借勢卸力，減少下次傷害"},
"青嵐破":{cost:7,power:2.1,desc:"劍氣破空，重創敵手"},
"斷潮刀":{cost:3,power:1.65,desc:"厚重刀勢，正面強攻"},
"守勢":{cost:2,guard:1.35,desc:"架刀守禦，穩住氣息"},
"怒濤斬":{cost:8,power:2.35,desc:"勢如怒潮，重斬對手"},
"寒星指":{cost:4,power:1.55,desc:"凝氣為指，直取要害"},
"凝神":{cost:0,heal:7,qi:5,desc:"凝神調息，恢復氣血與真氣"},
"霜華落":{cost:8,power:2.2,desc:"寒勁透骨，凌厲一擊"},
"花影掌":{cost:3,power:1.3,desc:"掌影翻飛，招式靈巧"},
"調息":{cost:0,heal:9,qi:7,desc:"運功療傷，回復狀態"},
"落英回春":{cost:6,heal:19,desc:"以內力護住心脈"},
"鐵山靠":{cost:3,power:1.75,desc:"貼身撞擊，破敵架勢"},
"沉肩":{cost:2,guard:1.55,desc:"沉肩墜肘，硬接來招"},
"震岳拳":{cost:8,power:2.4,desc:"拳勁震岳，一擊定勢"},
"野路子":{cost:2,power:1.4,desc:"沒有章法，反倒難以預測"},
"觀勢":{cost:0,guard:1,qi:4,desc:"觀察對手，積蓄真氣"},
"破綻一擊":{cost:7,power:2.3,desc:"看準破綻，一擊制勝"}
};
const encounters=[
{name:"山道剪徑客",hp:30,atk:6,exp:18,silver:12,desc:"兩名匪徒攔住去路，眼神不善。"},
{name:"迷途拳師",hp:39,atk:7,exp:25,silver:17,desc:"一名醉拳師搖搖晃晃地擋在路中央。"},
{name:"黑衣鏢客",hp:48,atk:9,exp:34,silver:25,desc:"黑衣人不發一語，刀光先行。"},
{name:"山寨頭目",hp:66,atk:11,exp:48,silver:36,desc:"寨主提刀現身，四周嘍囉都安靜下來。"}
];
let state=load();
function fresh(name,sectId){
const s=sects.find(x=>x.id===sectId)||sects[0];
return {name:name||"無名少俠",sect:s.id,level:1,exp:0,silver:30,hp:44,maxHp:44,qi:20,maxQi:20,
str:5+(s.stats.str||0),dex:5+(s.stats.dex||0),vit:5+(s.stats.vit||0),wis:5+(s.stats.wis||0),
wins:0,days:1,place:"sect",known:[s.moves[0],s.moves[1]],logs:["你踏入江湖，前路尚遠。"],combat:null,screen:"home"};
}
function load(){try{const x=JSON.parse(localStorage.getItem("jianghu-save"));return x&&x.name?x:null}catch(e){return null}}
function persist(){localStorage.setItem("jianghu-save",JSON.stringify(state));document.getElementById("save-status").textContent="已自動存檔 · "+new Date().toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"})}
function sect(){return sects.find(x=>x.id===state.sect)||sects[0]}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function addLog(t){state.logs.unshift(t);state.logs=state.logs.slice(0,9)}
function app(){const root=document.getElementById("app");if(!state){root.innerHTML=setup();wireSetup();return}
root.innerHTML=state.combat?combatView():homeView();wireGame()}
function setup(){return '<section class="hero"><div class="eyebrow">風起江湖 · 俠名待定</div><h1>這一趟，<br>你就是主角。</h1><p class="lead">從一名初入武林的尋常人開始，擇一門派拜師學藝，習武、歷練、結交同道。這個江湖沒有預寫好的結局。</p><label for="player-name">替自己取個江湖名</label><div class="name-row"><input id="player-name" maxlength="12" placeholder="輸入你的名字"><button id="begin">踏入江湖</button></div><p class="muted">選擇你的起點。門派會影響初始能力與所學招式。</p><div class="sect-grid">'+sects.map(s=>'<button class="sect-card" data-sect="'+s.id+'"><b>'+s.name+'</b><span>'+s.style+'</span><em>'+s.bonus+'</em></button>').join("")+'</div>'+(state?'<p><button id="continue-save">繼續上次旅程：'+esc(state.name)+'</button></p>':"")+'</section>'}
function wireSetup(){let selected=sects[0].id;document.querySelectorAll("[data-sect]").forEach(b=>b.onclick=()=>{selected=b.dataset.sect;document.querySelectorAll("[data-sect]").forEach(x=>x.style.borderColor="");b.style.borderColor="var(--gold)"});document.getElementById("begin").onclick=()=>{const n=document.getElementById("player-name").value.trim();state=fresh(n,selected);addLog("你在"+sect().name+"門前停下腳步，決意拜師學藝。");persist();app()};const c=document.getElementById("continue-save");if(c)c.onclick=()=>app()}
function homeView(){let s=sect();return '<div class="layout"><aside class="sidebar"><section class="panel"><h2>'+esc(state.name)+'</h2><div class="muted">'+s.name+' · '+rank(state.level)+' · 第 '+state.days+' 日</div><div class="bar hp"><i style="width:'+Math.max(0,state.hp/state.maxHp*100)+'%"></i></div><div class="stats"><span>氣血</span><b>'+state.hp+' / '+state.maxHp+'</b><span>真氣</span><b>'+state.qi+' / '+state.maxQi+'</b><span>臂力</span><b>'+state.str+'</b><span>身法</span><b>'+state.dex+'</b><span>根骨</span><b>'+state.vit+'</b><span>悟性</span><b>'+state.wis+'</b><span>閱歷</span><b>'+state.exp+' / '+nextExp()+'</b><span>銀兩</span><b>'+state.silver+' 兩</b><span>勝場</span><b>'+state.wins+'</b></div></section><section class="panel"><h2>行囊武學</h2>'+state.known.map(m=>'<div><span class="tag">招式</span>'+m+'</div>').join("")+'<p class="muted" style="margin:10px 0 0">新招式可親自向師傅請教。</p></section></aside><main class="panel main"><div class="eyebrow">第 '+state.days+' 日 · <span class="place-pill">'+esc(locationName())+'</span></div><h2>江湖路遠，且行且看</h2><p class="lead">你身在'+esc(locationName())+'。想習武，便去找師傅；想闖蕩，就下山走進青石鎮，親自打聽消息、選擇去處。</p><div class="actions"><button data-act="train">去找師傅</button><button data-act="travel">下山到青石鎮</button><button data-act="rest">去客棧歇息</button><button data-act="manual">查看江湖見聞</button></div><div id="scene">'+sceneContent()+"</div><h2 style='margin-top:24px'>旅途記聞</h2><ul class='log'>"+state.logs.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul></main></div>"}
function rank(l){return ["初出茅廬","略有小成","江湖新秀","聲名漸起","一方好手","武林名宿","絕頂高手"][Math.min(l-1,6)]}
function nextExp(){return state.level*35}
function locationName(){if(state.place==="town")return "青石鎮";if(state.place==="dojo")return sect().name+"演武場";if(state.place==="inn")return "青石鎮客棧";if(state.place==="road")return "青石鎮外官道";return sect().name+"山門"}
function sceneArt(kind){
const person=(x,robe,weapon)=>'<g transform="translate('+x+' 0)"><ellipse cx="0" cy="254" rx="43" ry="9" fill="#111814" opacity=".45"/><path d="M-30 175 Q-23 151 -12 144 L12 144 Q26 153 31 177 L46 239 Q20 251 0 239 Q-22 250 -46 239Z" fill="'+robe+'" stroke="#d9c9a0" stroke-opacity=".55" stroke-width="2"/><path d="M-15 148 L0 172 L15 148 M0 172 L0 238" fill="none" stroke="#e4d6b8" stroke-opacity=".55" stroke-width="3"/><path d="M-23 160 Q-46 177 -45 202 M23 160 Q42 174 46 194" fill="none" stroke="'+robe+'" stroke-width="13" stroke-linecap="round"/><circle cx="0" cy="116" r="26" fill="#d8b998"/><path d="M-25 117 Q-31 84 -5 82 Q19 81 27 107 L18 103 Q8 92 -11 98 Q-18 108 -25 117" fill="#27221d"/><path d="M-8 88 Q0 66 13 82 L13 98" fill="none" stroke="#27221d" stroke-width="8"/><path d="M-10 125 Q0 131 10 125" fill="none" stroke="#714d40" stroke-width="2"/>'+(weapon?'<path d="M48 190 L90 118" stroke="#d8d0bd" stroke-width="4"/><path d="M42 196 L55 183" stroke="#9b7744" stroke-width="6"/>':'')+'</g>';
if(kind==="dojo")return '<svg viewBox="0 0 840 280" role="img" aria-label="師傅與弟子在門派演武場相會"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#75816b"/><stop offset="1" stop-color="#d2b98b"/></linearGradient></defs><rect width="840" height="280" fill="url(#sky)"/><path d="M0 162 L120 78 210 156 320 57 430 160 540 76 650 155 770 66 840 127V280H0Z" fill="#566653" opacity=".72"/><path d="M0 181 Q230 145 420 181 T840 166V280H0Z" fill="#747b5b"/><path d="M100 119 L420 24 740 119 700 127 420 51 140 132Z" fill="#382f28"/><path d="M160 121 V216 M680 121 V216 M120 124 H720" stroke="#5b4130" stroke-width="13"/><path d="M145 220 H695" stroke="#d1b883" stroke-width="8"/><path d="M0 250 Q420 219 840 250V280H0" fill="#8e795c"/><path d="M115 250 Q420 235 760 250" fill="none" stroke="#d8c59c" stroke-width="2" opacity=".7"/>'+person(340,"#435646",false)+person(525,"#7a4938",true)+'<text x="340" y="274" fill="#eee0bd" font-size="13" text-anchor="middle">師傅</text><text x="525" y="274" fill="#eee0bd" font-size="13" text-anchor="middle">你</text><path d="M40 200 Q58 135 42 81 M65 200 Q83 136 65 93 M40 123 Q16 105 10 91 M66 137 Q92 119 95 103" fill="none" stroke="#445a42" stroke-width="7"/><circle cx="745" cy="62" r="28" fill="#ead49c" opacity=".75"/></svg>';
if(kind==="town")return '<svg viewBox="0 0 840 280" role="img" aria-label="青石鎮街道與等候交談的鎮民"><rect width="840" height="280" fill="#9eaa97"/><path d="M0 168 Q420 143 840 168V280H0Z" fill="#9b8668"/><path d="M0 252 Q400 218 840 252" fill="none" stroke="#d1bb92" stroke-width="3"/><path d="M55 71 H326 V189 H55Z" fill="#a77d58" stroke="#634a38" stroke-width="4"/><path d="M36 78 L190 24 347 78Z" fill="#47382e"/><path d="M77 98 H137 V151 H77Z M223 98 H287 V151 H223Z" fill="#d6bd8e"/><path d="M411 100 H777 V190 H411Z" fill="#84654b" stroke="#634a38" stroke-width="4"/><path d="M390 104 L590 43 799 104Z" fill="#40352d"/><path d="M468 119 H544 V188 H468Z" fill="#332d29"/><path d="M605 120 H704 V157 H605Z" fill="#d2b77e"/><path d="M604 120 H704" stroke="#45372d" stroke-width="8"/><path d="M366 137 V86 M359 91 H373" stroke="#57422f" stroke-width="5"/><path d="M367 93 L414 102 367 111Z" fill="#bf694d"/>'+person(294,"#54654a",false)+person(595,"#6d493e",false)+'<text x="294" y="274" fill="#332a20" font-size="13" text-anchor="middle">說書人</text><text x="595" y="274" fill="#332a20" font-size="13" text-anchor="middle">掌櫃</text><path d="M0 172 Q420 160 840 173" stroke="#66533d" stroke-width="3"/></svg>';
if(kind==="road")return '<svg viewBox="0 0 840 280" role="img" aria-label="青石鎮外山路上遇到的江湖人"><rect width="840" height="280" fill="#7d8b77"/><circle cx="710" cy="58" r="30" fill="#e5d19a"/><path d="M0 174 L140 65 245 160 390 42 535 166 690 66 840 153V280H0Z" fill="#465847"/><path d="M0 205 Q190 163 350 204 T840 182V280H0Z" fill="#778060"/><path d="M388 280 Q448 223 382 184 Q337 150 442 116 Q508 94 475 69" fill="none" stroke="#c3a779" stroke-width="30"/><path d="M388 280 Q448 223 382 184 Q337 150 442 116 Q508 94 475 69" fill="none" stroke="#e0c99c" stroke-width="3" stroke-dasharray="8 9"/>'+person(580,"#433d38",true)+'<path d="M35 195 Q58 131 43 74 M60 197 Q84 134 67 84 M44 119 Q20 105 15 91 M70 131 Q95 111 100 95" fill="none" stroke="#364b3b" stroke-width="8"/></svg>';
return '<svg viewBox="0 0 840 280" role="img" aria-label="青石鎮客棧燈火與旅人"><rect width="840" height="280" fill="#465249"/><path d="M0 212 H840 V280 H0Z" fill="#6a5946"/><path d="M102 88 H740 V232 H102Z" fill="#806448" stroke="#392e25" stroke-width="5"/><path d="M64 95 L420 20 778 95Z" fill="#342d28"/><path d="M155 120 H685" stroke="#d4bd8a" stroke-width="9"/><path d="M217 130 V228 M618 130 V228" stroke="#49382b" stroke-width="13"/><path d="M385 125 H455 V223 H385Z" fill="#332c26"/><path d="M310 62 V107 M530 62 V107" stroke="#382d24" stroke-width="5"/><path d="M288 105 H332 L326 143 H294Z M508 105 H552 L546 143 H514Z" fill="#c88846"/><path d="M0 255 Q420 235 840 255" stroke="#d5be91" stroke-width="3"/>'+person(302,"#5d5948",false)+'<text x="302" y="274" fill="#f0ddb1" font-size="13" text-anchor="middle">掌櫃</text></svg>';
}
function sceneCard(kind,title,dialogue,options){return '<section class="scene-card"><div class="scene-art">'+sceneArt(kind)+'</div><div class="scene-copy"><div class="person-label">人物互動 · '+esc(title)+'</div><p class="dialogue">「'+esc(dialogue)+'」</p><div class="scene-options">'+options+'</div></div></section>'}
function townOptions(){return '<button data-choice="town-talk">向說書人打聽消息</button><button data-choice="town-market">去街市看看</button><button data-choice="town-road">出鎮走上官道</button><button data-choice="town-inn">到客棧歇腳</button><button data-choice="town-return">收拾行囊，回山門</button>'}
function renderTown(){document.getElementById("scene").innerHTML=sceneCard("town","青石鎮街頭","客官初來乍到？鎮上有消息、有補給，出了西門便是官道。想先去哪裡？",townOptions());wireGame()}
function sceneContent(){return sceneCard(state.place==="town"?"town":state.place==="inn"?"inn":"dojo",state.place==="town"?"青石鎮":state.place==="inn"?"客棧大堂":"門派山門",state.place==="town"?"街上人來人往，說書人正等著聽你問話。":state.place==="inn"?"掌櫃擦拭著桌面，招呼你坐下。":"山風穿過松林，遠處演武場傳來一陣劍鳴。",state.place==="town"?townOptions():'<button data-act="train">去找師傅</button><button data-act="travel">下山到青石鎮</button>')}
function wireGame(){document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>act(b.dataset.act));document.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>choice(b.dataset.choice))}
function act(action){
if(action==="train"){state.place="dojo";const possible=sect().moves.filter(m=>!state.known.includes(m));document.getElementById("scene").innerHTML=sceneCard("dojo","演武場的師傅","來得正好。習武不能只看招式，先上前讓師傅看看你的架勢。",'<button data-choice="meet-master">向師傅行禮，請他指點</button><button data-choice="leave-dojo">暫且告退</button>');wireGame();return}
if(action==="travel"){if(state.place!=="town"){state.days++;state.place="town";addLog("你沿著山路下山，抵達熱鬧的青石鎮。")}renderTown();return}
if(action==="rest"){state.place="inn";document.getElementById("scene").innerHTML=sceneCard("inn","青石鎮客棧掌櫃","客官要住一晚嗎？五兩銀子，熱水和床鋪都替你備好。",'<button data-choice="sleep">住一晚，恢復氣血與真氣（五兩）</button><button data-choice="back-town">先不住，回到街上</button>');wireGame();return}
if(action==="manual"){document.getElementById("scene").innerHTML=sceneCard("town","街邊說書人","江湖不是地圖上的字。走進一座鎮，問過一個人，才算真正踏出山門。",'<button data-choice="back-town">回到街上</button>');wireGame()}
}
function presentTeacher(){const possible=sect().moves.filter(m=>!state.known.includes(m));if(!possible.length){state.exp+=7;state.qi=Math.min(state.maxQi,state.qi+4);levelCheck();addLog("師傅陪你拆解基本功，今日演武略有心得。");persist();document.getElementById("scene").innerHTML=sceneCard("dojo","師傅的指點","招式已熟，便要練到收放自如。今日這幾式打得不錯。",'<button data-choice="leave-dojo">謝過師傅，回山門</button>');wireGame();return}
document.getElementById("scene").innerHTML=sceneCard("dojo","師傅親自演示","你想學哪一式？先看師傅演一遍，再用閱歷把招式記進心裡。",possible.map(m=>'<button data-choice="learn:'+m+'">'+m+'（'+moves[m].desc+' · 8 閱歷）</button>').join("")+'<button data-choice="leave-dojo">今日先看到這裡</button>');wireGame()}
function choice(c){if(c==="back"){app();return}
if(c==="meet-master"){presentTeacher();return}
if(c==="leave-dojo"){state.place="sect";addLog("你向師傅告退，回到山門繼續修習。");persist();app();return}
if(c==="town-talk"){state.scout=true;addLog("你在茶棚聽說西門外近來有剪徑客出沒。");document.getElementById("scene").innerHTML=sceneCard("town","茶棚說書人","西門外這幾日不太平，過路人若肯看清對手的招式，交手時就不容易吃虧。",'<button data-choice="town-road">記下消息，去西門看看</button><button data-choice="back-town">回街上再逛逛</button>');wireGame();return}
if(c==="town-market"){document.getElementById("scene").innerHTML=sceneCard("town","街市小販","乾糧八兩一份，走遠路時帶著，能在路上補些氣力。",'<button data-choice="buy-food">買乾糧（八兩，恢復 8 點氣血）</button><button data-choice="back-town">不買，回到街上</button>');wireGame();return}
if(c==="buy-food"){if(state.silver<8){alert("銀兩不足，先去歷練賺些盤纏吧。");return}state.silver-=8;state.hp=Math.min(state.maxHp,state.hp+8);addLog("你在街市買了乾糧，路上補充體力。");persist();renderTown();return}
if(c==="town-inn"){act("rest");return}
if(c==="town-return"){state.place="sect";addLog("你告別青石鎮，沿山路返回門派。");persist();app();return}
if(c==="back-town"){state.place="town";renderTown();return}
if(c==="sleep"){if(state.silver<5){alert("銀兩不足，還付不起房錢。");return}state.silver-=5;state.days++;state.hp=Math.min(state.maxHp,state.hp+Math.ceil(state.maxHp*.48));state.qi=state.maxQi;addLog("你在青石鎮客棧安穩睡了一夜，氣血與真氣恢復。");persist();renderTown();return}
if(c==="town-road"){const e=encounters[Math.floor(Math.random()*Math.min(encounters.length,Math.ceil(state.level/2)+1))];state.pending=e;document.getElementById("scene").innerHTML=sceneCard("road","青石鎮外官道",e.desc+" 你要如何應對？",'<button data-choice="start-road-fight">上前喝止，拔劍迎戰</button><button data-choice="avoid-road">避開對方，先回鎮上</button><button data-choice="back-town">回青石鎮再打聽</button>');wireGame();return}
if(c==="start-road-fight"){startFight(state.pending);return}
if(c==="avoid-road"){state.scout=false;addLog("你選擇避開官道上的風波，平安返回青石鎮。");renderTown();return}
if(c.startsWith("learn:")){const m=c.slice(6);if(state.exp<8){alert("閱歷不足。先下山歷練、累積閱歷吧。");return}state.exp-=8;state.known.push(m);addLog("師傅親自演示後，你學會了「"+m+"」。");persist();presentTeacher();return}
if(c==="observe"){state.days++;state.scout=true;addLog("你觀察對手的步法，記住了對方的破綻。");persist();app();return}
if(c==="fight"){startFight(state.pending);return}
if(c.startsWith("move:")){playerMove(c.slice(5));return}}
function startFight(e){state.days++;state.combat={enemy:{...e,hp:e.hp,maxHp:e.hp},guard:0,scout:!!state.scout,returnPlace:state.place};state.scout=false;state.place="road";addLog("你與「"+e.name+"」交手，刀劍聲驚起林間飛鳥。");persist();app()}
function combatView(){let c=state.combat,e=c.enemy;return '<div class="layout"><aside class="sidebar"><section class="panel"><h2>'+esc(state.name)+'</h2><div class="muted">'+sect().name+' · '+rank(state.level)+'</div><p>氣血 '+state.hp+' / '+state.maxHp+'</p><div class="bar hp"><i style="width:'+Math.max(0,state.hp/state.maxHp*100)+'%"></i></div><p>真氣 '+state.qi+' / '+state.maxQi+'</p><div class="bar qi"><i style="width:'+Math.max(0,state.qi/state.maxQi*100)+'%"></i></div><div class="stats"><span>臂力</span><b>'+state.str+'</b><span>身法</span><b>'+state.dex+'</b><span>根骨</span><b>'+state.vit+'</b></div></section><section class="panel"><h2>交手記錄</h2><ul class="log">'+state.logs.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul></section></aside><main class="panel main"><div class="eyebrow">回合制交鋒 · 第 '+(c.turn||1)+' 回合</div><h2>招式已出，勝負未分</h2><section class="enemy"><h3>'+esc(e.name)+'</h3><p>'+esc(e.desc)+'</p><div>對手氣血：'+Math.max(0,e.hp)+' / '+e.maxHp+'</div><div class="bar hp"><i style="width:'+Math.max(0,e.hp/e.maxHp*100)+'%"></i></div></section><p>選擇本回合招式。真氣不足時無法施展消耗真氣的功夫。</p><div class="combat-moves">'+state.known.map(m=>{let x=moves[m];return '<button class="move" data-choice="move:'+m+'" '+(state.qi<x.cost?'disabled':'')+'><strong>'+m+'</strong><small>'+x.desc+' · 真氣 '+x.cost+'</small></button>'}).join("")+'</div><div class="actions"><button data-choice="move:逃走">伺機脫身</button></div></main></div>'}
function playerMove(m){let c=state.combat,e=c.enemy;if(m==="逃走"){if(Math.random()<.65){state.place=state.combat.returnPlace||"town";state.combat=null;addLog("你趁隙脫身，保全實力。");persist();app();return}else addLog("對手封住退路，你只得繼續迎戰。")}
else{let x=moves[m];state.qi-=x.cost;if(x.heal){let gain=x.heal+(m==="落英回春"?Math.floor(state.wis/2):0);state.hp=Math.min(state.maxHp,state.hp+gain);addLog("你使出「"+m+"」，恢復 "+gain+" 點氣血。")}
if(x.qi){state.qi=Math.min(state.maxQi,state.qi+x.qi);addLog("你運轉內息，真氣有所恢復。")}
if(x.guard){c.guard=x.guard;addLog("你使出「"+m+"」，凝神守住門戶。")}
if(x.power){let hit=Math.max(2,Math.floor((state.str*1.6+state.dex*.7)*x.power*(.82+Math.random()*.36)));if(c.scout){hit=Math.floor(hit*1.25);c.scout=false;addLog("你抓住先前觀察到的破綻！")}e.hp-=hit;addLog("你以「"+m+"」命中，造成 "+hit+" 點傷害。")}}
if(e.hp<=0){winFight();return}
let dmg=Math.max(1,Math.floor(e.atk+Math.random()*5-state.vit*.45-state.dex*.3)-c.guard);c.guard=0;state.hp-=dmg;c.turn=(c.turn||1)+1;addLog(e.name+"趁勢反擊，你受到 "+dmg+" 點傷害。");
if(state.hp<=0){state.hp=1;state.silver=Math.max(0,state.silver-12);state.place="town";state.combat=null;addLog("你力竭倒地，幸得路人相救。醒來時已在青石鎮客棧，遺失了些銀兩。")}
persist();app()}
function winFight(){let e=state.combat.enemy;state.exp+=e.exp;state.silver+=e.silver;state.wins++;state.place=state.combat.returnPlace||"town";state.combat=null;state.hp=Math.max(1,state.hp);addLog("你擊退"+e.name+"，得閱歷 "+e.exp+"、銀兩 "+e.silver+"。");levelCheck();persist();app()}
function levelCheck(){while(state.exp>=nextExp()){state.exp-=nextExp();state.level++;state.maxHp+=8+Math.floor(state.vit/3);state.maxQi+=3+Math.floor(state.wis/3);state.str++;if(state.level%2===0)state.dex++;state.hp=state.maxHp;state.qi=state.maxQi;addLog("你突破至「"+rank(state.level)+"」！氣血、真氣盡復，武學根基更上一層。")}}
app();
})();
</script>
</body>
</html>
